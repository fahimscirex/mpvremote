<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon points='7 4 20 12 7 20' fill='%2300e5ff'/></svg>">
<title>mpv remote</title>
<script>
  // Restore the theme before first paint so there is no flash of the default.
  try {
    var t = localStorage.getItem("mpvremote-theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  /* ---------- palette ----------
     Cyberpunk is the default so it paints before the theme script runs;
     the rest are opt-in via data-theme on <html>. Order matters: these all
     have the same specificity as :root, so the overrides must come after. */
  :root, [data-theme=cyberpunk] {
    --bg: #05060f;
    --surface: #0b1020;
    --surface-2: #141c33;
    --surface-3: #1f2c4d;
    --fg: #e6f7ff;
    --muted: #6f88ad;
    --border: #1a2440;
    --accent: #00e5ff;
    --accent-fg: #04121a;
    --accent-hi: #5cf0ff;
    --accent-soft: rgb(0 229 255 / 0.4);
    --fill: #00e5ff;
    --dir: #ff2e88;
    --placeholder: #6079a3;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  [data-theme=slate] {
    --bg: #020617;
    --surface: #0f172a;
    --surface-2: #1e293b;
    --surface-3: #293548;
    --fg: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --accent: #ef4444;
    --accent-fg: #ffffff;
    --accent-hi: #f05252;
    --accent-soft: rgb(239 68 68 / 0.4);
    --fill: var(--fg);
    --dir: #60a5fa;
    --placeholder: #64748b;
  }

  [data-theme=synthwave] {
    --bg: #120720;
    --surface: #1c0d2e;
    --surface-2: #2a1546;
    --surface-3: #3d2065;
    --fg: #ffe9f7;
    --muted: #a184c2;
    --border: #341f59;
    --accent: #ff2d95;
    --accent-fg: #ffffff;
    --accent-hi: #ff5cae;
    --accent-soft: rgb(255 45 149 / 0.4);
    --fill: #ff2d95;
    --dir: #ffb800;
    --placeholder: #9074b6;
  }

  [data-theme=crt] {
    --bg: #0a0a06;
    --surface: #13120a;
    --surface-2: #1e1c10;
    --surface-3: #2e2b18;
    --fg: #ffc966;
    --muted: #b08f3d;
    --border: #2b2816;
    --accent: #ffb000;
    --accent-fg: #140f00;
    --accent-hi: #ffc633;
    --accent-soft: rgb(255 176 0 / 0.4);
    --fill: #ffb000;
    --dir: #ffdf9e;
    --placeholder: #94773a;
    --font: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
  }

  :root {
    /* Emil: built-in easings are too weak. */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --press: 160ms;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
  }

  * { box-sizing: border-box; margin: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    transition: background-color 240ms ease;
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    padding-top: calc(16px + env(safe-area-inset-top));
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  svg { display: block; flex-shrink: 0; }
  #sprite { display: none; }

  /* ---------- connection banner ---------- */
  #connbar {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    background: var(--accent); color: var(--accent-fg);
    padding: 10px 12px; border-radius: var(--r-md); margin-bottom: 12px;
    font-size: 14px; font-weight: 500;
    /* Emil: exits are faster than entrances. */
    transition: opacity 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  body:not(.disconnected) #connbar { display: none; }
  @starting-style { #connbar { opacity: 0; transform: translateY(-8px); } }

  body.disconnected main { opacity: 0.45; pointer-events: none; }
  main { transition: opacity 220ms var(--ease-out); }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px;
    margin-bottom: 12px;
    /* Only ever fires on a theme swap; these colours are otherwise static. */
    transition: background-color 240ms ease, border-color 240ms ease;
  }

  /* ---------- theme switcher ---------- */
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .themes button { justify-content: flex-start; gap: 10px; }
  .themes button[aria-pressed=true] { border-color: var(--accent); }
  .sw {
    width: 16px; height: 16px; border-radius: 50%;
    flex-shrink: 0; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.15);
  }
  [data-t=cyberpunk] .sw { background: #00e5ff; }
  [data-t=synthwave] .sw { background: #ff2d95; }
  [data-t=crt]       .sw { background: #ffb000; }
  [data-t=slate]     .sw { background: #ef4444; }

  /* ---------- server address footer ---------- */
  #serverbar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 4px; padding: 8px;
    color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums;
    /* selectable so the address can be copied; clipboard API needs a secure
       context, which plain http on a LAN IP is not */
    user-select: text; -webkit-user-select: text;
  }
  #serverbar .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--fill); flex-shrink: 0;
    transition: background-color 200ms ease;
  }
  body.disconnected #serverbar .dot { background: var(--accent); }

  /* ---------- tabs (interior.dev/docs/tabs) ---------- */
  .tabs { padding: 0; overflow: hidden; }
  .tablist {
    position: relative; display: flex; gap: 4px;
    padding: 6px 6px 0;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  /* One element carried between tabs, never two bars crossfading past each
     other. Left/width rather than transform: it is out of flow, so this
     invalidates only its own box, and scaleX would squash the corner radius. */
  .tab-ind {
    position: absolute; left: 0; top: 6px; bottom: -1px; width: 0;
    background: var(--surface); opacity: 0;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
  }
  .tablist button {
    position: relative; z-index: 1;
    flex: 1; min-width: 0; min-height: 44px; padding: 0 8px;
    background: transparent; border: none;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
    color: var(--muted); font-size: 13px; font-weight: 400; gap: 8px;
    transition: color 150ms ease, background-color 150ms ease;
  }
  /* The plateau does not scale, so the label must not either. */
  .tablist button:active { transform: none; }
  .tablist button[aria-selected=true] { color: var(--fg); }
  .tablist button:focus-visible {
    outline: none; box-shadow: inset 0 0 0 2px var(--accent);
  }
  @media (hover: hover) and (pointer: fine) {
    .tablist button:not([aria-selected=true]):hover {
      color: var(--fg); background: rgb(255 255 255 / 0.05);
    }
  }
  /* An invisible copy at the selected weight holds the cell width, so the row
     never reflows on selection and the indicator never lands on stale sizes. */
  .tab-label { display: grid; place-items: center; min-width: 0; }
  .tab-label > * { grid-area: 1 / 1; white-space: nowrap; }
  .tab-sizer { visibility: hidden; font-weight: 600; }
  .tablist button[aria-selected=true] .tab-text { font-weight: 600; }

  .tabpanel {
    padding: 16px; outline: none;
    animation: panelIn 240ms var(--ease-out) both;
  }
  .tabpanel:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  @keyframes panelIn {
    from { opacity: 0; transform: translateX(var(--dir, 10px)); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- now playing / title marquee ---------- */
  /* interior.dev/docs/logo-marquee, adapted to one line of text */
  #title {
    position: relative; isolation: isolate;
    font-size: 17px; font-weight: 600; line-height: 1.4;
    height: 24px;
  }
  #title.idle { color: var(--muted); font-weight: 400; }
  /* Fade the ends only when the text actually runs past them. */
  #title.scrolling {
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
  }
  .mq-view { overflow: hidden; outline: none; }
  .mq-track { display: flex; width: max-content; will-change: transform; }
  .mq-group { white-space: nowrap; flex: none; }
  @media (prefers-reduced-motion: reduce) {
    /* Not a transport any more: a plain row the user can scroll themselves. */
    .mq-view { overflow-x: auto; scrollbar-width: none; }
    .mq-view::-webkit-scrollbar { display: none; }
  }

  /* ---------- seek + volume sliders ---------- */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 24px; background: transparent;
    cursor: pointer; display: block;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: var(--track, var(--surface-3));
  }
  input[type=range]::-moz-range-track {
    height: 6px; border-radius: 3px;
    background: var(--track, var(--surface-3));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -4px;
    border-radius: 50%; background: var(--fill); border: none;
    transition: transform var(--press) var(--ease-out);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%; background: var(--fill); border: none;
    transition: transform var(--press) var(--ease-out);
  }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.35); }
  input[type=range]:active::-moz-range-thumb { transform: scale(1.35); }
  input[type=range]:focus-visible { outline: none; }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
  input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }

  #seekwrap { margin-top: 14px; }
  #fileidx { flex: 0 0 auto; opacity: 0.75; }
  .times {
    display: flex; justify-content: space-between; gap: 8px;
    color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums; /* no width jitter as digits tick */
    margin-top: 2px;
  }

  /* ---------- buttons ---------- */
  button {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface-2); color: var(--fg);
    border: 1px solid transparent; border-radius: var(--r-md);
    font: inherit; font-size: 14px; font-weight: 500;
    min-height: 48px; padding: 0 12px;
    cursor: pointer;
    transition: transform var(--press) var(--ease-out),
                background-color 180ms ease,
                color 180ms ease;
  }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    button:hover { background: var(--surface-3); }
  }

  .transport { display: flex; gap: 6px; margin-top: 14px; }
  .transport button { flex: 1; padding: 0 4px; }
  .transport.secondary { margin-top: 6px; }
  .transport.secondary button { font-size: 13px; min-height: 44px; gap: 8px; }
  button:disabled { opacity: 0.35; cursor: default; }
  #playpause {
    flex: 1.5;
    background: var(--accent); color: var(--accent-fg);
  }
  @media (hover: hover) and (pointer: fine) {
    #playpause:hover { background: var(--accent-hi); }
  }

  /* ---------- control rows ---------- */
  .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .row > svg { color: var(--muted); }
  .dt .row { margin-top: 0; }
  .row .dt-track { flex: 1; min-width: 0; }
  #mute { flex: 0 0 48px; min-width: 48px; padding: 0; }
  #mute.muted, #fs.on { color: var(--accent); }

  /* ---------- detent slider (interior.dev/docs/slider-detents) ---------- */
  .dt { margin-top: 16px; }
  .dt-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 2px;
  }
  .dt-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--muted);
  }
  /* The readout reserves the widest reachable string up front, so the number
     never reflows as it ticks or as the detent name fades in beside it. */
  .dt-readout { display: grid; justify-items: end; }
  .dt-readout > * {
    grid-area: 1 / 1;
    white-space: pre; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .dt-sizer { visibility: hidden; }
  .dt-value { color: var(--fg); }
  .dt-suffix {
    color: var(--muted);
    transition: opacity 220ms var(--ease-out);
  }

  .dt-track {
    position: relative; height: 44px; width: 100%;
    border-radius: var(--r-sm);
    cursor: grab; touch-action: none; outline: none;
    /* The carriages span the full track and are then translated by a
       percentage, so their trailing edge runs past it. Contain that here or
       it becomes page-wide horizontal scroll. Thumb and ticks always sit
       inside the track box, so nothing visible is clipped. */
    overflow: hidden;
  }
  .dt-track.dragging { cursor: grabbing; }
  .dt-track:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .dt-track[aria-disabled=true] { opacity: 0.4; pointer-events: none; }

  .dt-rail {
    position: absolute; left: 0; right: 0; top: 19px; height: 6px;
    border-radius: 3px; background: var(--surface-3); overflow: hidden;
  }
  /* Thumb-inset band: everything positions as a % of this, so there is no
     measurement pass and no jump on first paint. */
  .dt-inset { position: absolute; top: 0; bottom: 0; left: 7px; right: 7px; }
  .dt-carriage { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  /* Fill is a clipped translate, never an animated width. */
  .dt-fill {
    position: absolute; top: 0; bottom: 0; right: 100%; width: 2000px;
    background: var(--fill);
  }
  .dt-thumb {
    position: absolute; top: 15px; margin-left: -7px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--fill);
    transition: transform var(--press) var(--ease-out);
  }
  .dt-track.dragging .dt-thumb { transform: scale(1.35); }
  .dt-tick {
    position: absolute; top: 31px; width: 2px; height: 5px;
    margin-left: -1px; border-radius: 1px;
    background: var(--fill); opacity: 0.35;
  }

  /* ---------- selects ---------- */
  .selectwrap { position: relative; flex: 1; min-width: 0; }
  .selectwrap > svg {
    position: absolute; right: 12px; top: 50%; margin-top: -8px;
    width: 16px; height: 16px; color: var(--muted); pointer-events: none;
  }
  select {
    -webkit-appearance: none; appearance: none;
    width: 100%; min-height: 48px;
    background: var(--surface-2); color: var(--fg);
    border: 1px solid transparent; border-radius: var(--r-md);
    padding: 0 36px 0 12px;
    font: inherit; font-size: 14px;
    cursor: pointer;
    text-overflow: ellipsis;
    transition: background-color 180ms ease;
  }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select:disabled { opacity: 0.4; cursor: default; }

  /* ---------- open url ---------- */
  #urlform { display: flex; gap: 8px; }
  #urlinput {
    flex: 1; min-width: 0; min-height: 48px;
    background: var(--surface-2); color: var(--fg);
    border: 1px solid transparent; border-radius: var(--r-md);
    padding: 0 14px; font: inherit; font-size: 15px;
    transition: border-color 180ms ease;
  }
  #urlinput::placeholder { color: var(--placeholder); }
  #urlinput:focus { outline: none; border-color: var(--accent); }
  #urlform button { flex: 0 0 auto; padding: 0 18px; }

  /* ---------- file browser ---------- */
  #crumb {
    display: block; color: var(--muted); font-size: 12px;
    margin: 0 0 10px; word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  #files { list-style: none; padding: 0; margin: 0 -8px; }
  #files li {
    display: flex; align-items: center; gap: 12px;
    min-height: 48px; padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 15px; word-break: break-word;
    cursor: pointer;
    transition: background-color 140ms ease;
    /* Stagger: decorative only, never blocks input. */
    animation: rise 260ms var(--ease-out) both;
    animation-delay: calc(var(--i) * 22ms);
  }
  #files li:last-child { border-bottom: none; }
  #files li:active { background: var(--surface-2); }
  @media (hover: hover) and (pointer: fine) {
    #files li:hover { background: var(--surface-2); }
  }
  #files li svg { color: var(--muted); }
  #files li.dir svg { color: var(--dir); }
  #files li.playing {
    color: var(--accent);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  #files li.playing svg { color: var(--accent); }
  #files .empty {
    color: var(--muted); font-size: 14px; justify-content: center;
    cursor: default; animation: none;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    /* Keep opacity/color cues, drop movement. */
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      transition-duration: 120ms !important;
    }
    button:active { transform: none; }
    #files li { animation: none; }
  }
</style>
</head>
<body class="disconnected">

<script>
const $ = id => document.getElementById(id);
const state = {};
let seeking = false;

function fmt(s) {
  if (s == null || isNaN(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}

// Only touch the DOM when the value actually changed — render() runs twice a
// second for hours on end.
function set(el, key, val) {
  if (el["_" + key] === val) return;
  el["_" + key] = val;
  if (key === "text") el.textContent = val;
  else if (key === "icon") el.setAttribute("href", val);
  else el[key] = val;
}

function fill(el, pct) {
  const p = Math.max(0, Math.min(100, pct));
  set(el, "style_track",
      `linear-gradient(90deg, var(--fill) ${p}%, var(--surface-3) ${p}%)`);
  el.style.setProperty("--track", el._style_track);
}

// ---------- detent slider ----------
// Vanilla port of interior.dev/docs/slider-detents. Stops you can feel: inside
// the pull radius the pointer hands the value to the detent and the thumb
// springs ahead of the finger to show it happened.
const THUMB = 14;
const tidy = v => Math.round(v * 1e6) / 1e6;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Minimal spring integrator. rAF runs only while settling, never at idle.
function spring(onFrame, stiffness, damping, mass) {
  let pos = 0, vel = 0, target = 0, raf = 0, last = 0;
  const tick = now => {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    const steps = Math.max(1, Math.ceil(dt * 240));
    const h = dt / steps;
    for (let i = 0; i < steps; i++) {
      vel += (-stiffness * (pos - target) - damping * vel) / mass * h;
      pos += vel * h;
    }
    if (Math.abs(pos - target) < 0.01 && Math.abs(vel) < 0.05) {
      pos = target; vel = 0; raf = 0;
    } else {
      raf = requestAnimationFrame(tick);
    }
    onFrame(pos);
  };
  return {
    set(v) {
      if (v === target) return;
      target = v;
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    },
    jump(v) {
      target = pos = v; vel = 0;
      if (raf) cancelAnimationFrame(raf);
      raf = 0; onFrame(pos);
    },
  };
}

function detentSlider(track, out, o) {
  const {min, max, step, format, label, onCommit} = o;
  const span = max - min;
  const pull = o.pull ?? span * 0.045;
  const detents = (o.detents || []).map(d => typeof d === "number" ? {value: d} : d);

  track.innerHTML =
    '<div class="dt-rail"><div class="dt-inset"><div class="dt-carriage">' +
      '<div class="dt-fill"></div></div></div></div>' +
    '<div class="dt-inset dt-ticks"></div>' +
    '<div class="dt-inset"><div class="dt-carriage"><div class="dt-thumb"></div></div></div>';

  const carriages = track.querySelectorAll(".dt-carriage");
  const ticks = track.querySelector(".dt-ticks");
  for (const d of detents) {
    const t = document.createElement("span");
    t.className = "dt-tick";
    t.style.left = (span > 0 ? (d.value - min) / span * 100 : 0) + "%";
    ticks.appendChild(t);
  }

  // Measure the widest reachable string into the readout so it never reflows.
  const widest = [format(min), format(max)]
    .concat(detents.map(d => d.label ? format(d.value) + " · " + d.label : format(d.value)))
    .reduce((a, b) => b.length > a.length ? b : a, "");
  const sizer = document.createElement("span");
  sizer.className = "dt-sizer";
  sizer.textContent = widest;
  const live = document.createElement("span");
  live.className = "dt-value";
  const num = document.createTextNode("");
  const suffix = document.createElement("span");
  suffix.className = "dt-suffix";
  live.append(num, suffix);
  out.append(sizer, live);

  const move = spring(p => {
    const t = "translateX(" + p + "%)";
    // Written straight onto the two carriages — a CSS var on the parent would
    // recalc every child instead.
    carriages[0].style.transform = t;
    carriages[1].style.transform = t;
  }, 520, 34, 0.45);

  track.setAttribute("role", "slider");
  track.tabIndex = 0;
  track.setAttribute("aria-orientation", "horizontal");
  track.setAttribute("aria-valuemin", min);
  track.setAttribute("aria-valuemax", max);
  track.setAttribute("aria-label", label);

  let value = o.value ?? min, marked = -1, held = false, lastLabel = "";

  function paint() {
    const pct = span > 0 ? Math.min(1, Math.max(0, (value - min) / span)) : 0;
    if (REDUCED) move.jump(pct * 100); else move.set(pct * 100);
    const name = detents.find(d => tidy(d.value) === tidy(value))?.label || "";
    if (name) lastLabel = name;
    num.nodeValue = format(value);
    // Keep the old label mounted so it fades out rather than vanishing.
    suffix.textContent = lastLabel ? " · " + lastLabel : "";
    suffix.style.opacity = name ? "1" : "0";
    track.setAttribute("aria-valuenow", value);
    track.setAttribute("aria-valuetext", name ? format(value) + ", " + name : format(value));
  }

  function commit(next) {
    const settled = Math.min(max, Math.max(min, tidy(next)));
    const i = detents.findIndex(d => tidy(d.value) === settled);
    if (i !== marked) {
      marked = i;
      if (i >= 0 && held) navigator.vibrate?.(6);
    }
    if (settled === value) return;
    value = settled;
    paint();
    onCommit(settled);
  }

  function capture(clientX) {
    const rect = track.getBoundingClientRect();
    const travel = rect.width - THUMB;
    if (travel <= 0 || span <= 0) return null;
    const ratio = (clientX - rect.left - THUMB / 2) / travel;
    const raw = Math.min(max, Math.max(min, min + ratio * span));
    let best = -1, nearest = pull;
    for (let i = 0; i < detents.length; i++) {
      const dist = Math.abs(raw - detents[i].value);
      if (dist <= nearest) { nearest = dist; best = i; }
    }
    if (best >= 0) return detents[best].value;
    return min + Math.round((raw - min) / step) * step;
  }

  const release = () => {
    if (!held) return;
    held = false;
    track.classList.remove("dragging");
  };

  track.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    track.setPointerCapture?.(e.pointerId);
    track.focus({preventScroll: true});
    held = true;
    track.classList.add("dragging");
    const n = capture(e.clientX);
    if (n !== null) commit(n);
  });
  track.addEventListener("pointermove", e => {
    if (!held) return;
    const n = capture(e.clientX);
    if (n !== null) commit(n);
  });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) {
    track.addEventListener(ev, release);
  }
  addEventListener("blur", release);

  function toDetent(dir) {
    const vals = detents.map(d => d.value).sort((a, b) => a - b);
    const target = dir > 0
      ? vals.find(v => v > value + 1e-6)
      : vals.filter(v => v < value - 1e-6).pop();
    commit(target ?? (dir > 0 ? max : min));
  }

  track.addEventListener("keydown", e => {
    const fwd = e.key === "ArrowRight" || e.key === "ArrowUp";
    const back = e.key === "ArrowLeft" || e.key === "ArrowDown";
    // Arrows move by exactly one step and ignore detent capture, so a sticky
    // detent can never make an in-between value unreachable.
    if (fwd || back) {
      const dir = fwd ? 1 : -1;
      if (e.shiftKey) toDetent(dir); else commit(value + dir * step);
    } else if (e.key === "PageUp") toDetent(1);
    else if (e.key === "PageDown") toDetent(-1);
    else if (e.key === "Home") commit(min);
    else if (e.key === "End") commit(max);
    else return;
    e.preventDefault();
  });

  paint();

  return {
    setValue(v) {
      if (held) return; // never fight the finger
      const settled = Math.min(max, Math.max(min, tidy(v)));
      if (settled === value) return;
      value = settled;
      marked = detents.findIndex(d => tidy(d.value) === settled);
      paint();
    },
  };
}

// ---------- title marquee ----------
// Vanilla port of interior.dev/docs/logo-marquee for a single line of text.
// Two departures from the original: it only becomes a transport when the text
// actually overflows (a short filename has no business sliding around), and
// the focus-reveal nudge is not ported because nothing inside is focusable.
function marquee(host, {speed = 40, gap = 48} = {}) {
  const view = document.createElement("div");
  view.className = "mq-view";
  const track = document.createElement("div");
  track.className = "mq-track";
  track.style.gap = gap + "px";
  view.append(track);
  // replace, not append: the host carries placeholder text in the HTML as a
  // no-JS fallback, and it would otherwise render on top of the strip.
  host.replaceChildren(view);
  if (REDUCED) view.tabIndex = 0;

  const MAX = 12, RAMP = 0.19;
  let text = "", copies = 0, span = 0, offset = 0, rate = 0;
  let held = false, near = true, raf = 0, last = 0, active = false;

  const paint = () => {
    track.style.transform = (!active || REDUCED)
      ? "translate3d(0,0,0)"
      : "translate3d(" + (offset - span).toFixed(2) + "px,0,0)";
  };

  function build(n) {
    copies = n;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "mq-group";
      s.textContent = text;
      // Only one copy is real, so a screen reader reads the title once.
      if (i !== 0) s.setAttribute("aria-hidden", "true");
      frag.append(s);
    }
    track.replaceChildren(frag);
  }

  function layout() {
    if (!copies) build(1);
    const w = track.firstChild.getBoundingClientRect().width;
    const room = view.getBoundingClientRect().width;
    active = !REDUCED && w > room + 1;
    host.classList.toggle("scrolling", active);
    span = active ? w + gap : 0;
    // Enough repeats that a wide viewport never runs out of content and the
    // wrap lands pixel-identical to the position before it.
    const want = active ? Math.max(3, Math.min(MAX, Math.ceil(room / span) + 2)) : 1;
    if (want !== copies) build(want);
    if (!active) { offset = 0; stop(); } else if (near) start();
    paint();
  }

  function tick(now) {
    raf = requestAnimationFrame(tick);
    // Clamped so returning from a background tab resumes instead of teleporting.
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;
    if (!span) return;
    // Ramp rather than cut, and never reset offset: entry eases the strip to a
    // stop, leaving resumes from the pixel it stopped on.
    rate += ((held ? 0 : 1) - rate) * (1 - Math.exp(-dt / RAMP));
    let x = offset - speed * rate * dt;
    if (rate > 0.002) { const m = x % span; x = m > 0 ? m - span : m; }
    offset = x;
    paint();
    if (held && rate < 0.002) stop(); // fully settled: stop burning frames
  }

  function start() {
    if (!raf && active && near && !REDUCED) { last = 0; raf = requestAnimationFrame(tick); }
  }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

  const setHeld = v => { held = v; start(); };
  for (const e of ["pointerenter", "pointerdown", "focusin"]) view.addEventListener(e, () => setHeld(true));
  for (const e of ["pointerleave", "focusout"]) view.addEventListener(e, () => setHeld(false));
  addEventListener("pointerup", () => setHeld(false));
  addEventListener("blur", () => setHeld(false));

  // Unsubscribe the loop entirely while the strip is off-screen.
  new IntersectionObserver(es => {
    near = es[es.length - 1].isIntersecting;
    near ? start() : stop();
  }, {rootMargin: "96px"}).observe(view);

  // Re-measure on viewport changes and on the theme's monospace font swap.
  const ro = new ResizeObserver(() => layout());
  ro.observe(view);
  ro.observe(track);

  return {
    setText(s) {
      if (s === text) return;
      text = s;
      offset = 0;
      build(copies || 1);
      layout();
    },
    relayout: layout,
  };
}

// ---------- tabs ----------
// Vanilla port of interior.dev/docs/tabs.
function initTabs(list, host) {
  const tabs = [...list.querySelectorAll("button[data-tab]")];
  const ind = list.querySelector(".tab-ind");
  const panels = new Map([...host.children].map(p => [p.dataset.panel, p]));
  let current = null;

  // Pair each tab with its panel so a screen reader is handed one section of
  // content rather than all of them stacked.
  for (const [v, p] of panels) {
    const t = tabs.find(b => b.dataset.tab === v);
    t.id = "tab-" + v;
    t.setAttribute("aria-controls", "panel-" + v);
    p.id = "panel-" + v;
    p.setAttribute("role", "tabpanel");
    p.setAttribute("aria-labelledby", "tab-" + v);
    p.tabIndex = 0;
  }

  // Reuses the detent slider's integrator; interrupting a move resumes from
  // where the bar currently is instead of restarting it.
  const px = spring(v => { ind.style.left = v + "px"; }, 620, 42, 0.35);
  const pw = spring(v => { ind.style.width = v + "px"; }, 620, 42, 0.35);

  function measure(jump) {
    const btn = tabs.find(t => t.dataset.tab === current);
    if (!btn || !btn.offsetWidth) return;
    ind.style.opacity = "1";
    if (jump || REDUCED) { px.jump(btn.offsetLeft); pw.jump(btn.offsetWidth); }
    else { px.set(btn.offsetLeft); pw.set(btn.offsetWidth); }
  }

  function select(next, jump) {
    if (next === current || !panels.has(next)) return;
    const from = tabs.findIndex(t => t.dataset.tab === current);
    const to = tabs.findIndex(t => t.dataset.tab === next);
    const dir = from < 0 ? 0 : (to < from ? -1 : 1);
    current = next;
    for (const t of tabs) {
      const on = t.dataset.tab === current;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1; // only the selected tab sits in the page tab order
    }
    // Only the selected panel is mounted; re-inserting restarts its animation.
    const p = panels.get(current);
    p.style.setProperty("--dir", (dir * 10) + "px");
    host.replaceChildren(p);
    measure(jump);
    try { localStorage.setItem("mpvremote-tab", current); } catch (e) {}
  }

  for (const t of tabs) t.onclick = () => select(t.dataset.tab);

  list.addEventListener("keydown", e => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    let to;
    if (e.key === "ArrowRight") to = (i + 1) % tabs.length;
    else if (e.key === "ArrowLeft") to = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") to = 0;
    else if (e.key === "End") to = tabs.length - 1;
    else return;
    e.preventDefault();
    tabs[to].focus();
    select(tabs[to].dataset.tab);
  });

  // Tab widths shift when the theme swaps to a monospace font; re-read rather
  // than leave the bar on stale measurements.
  const ro = new ResizeObserver(() => measure(true));
  for (const t of tabs) ro.observe(t);

  let saved = null;
  try { saved = localStorage.getItem("mpvremote-tab"); } catch (e) {}
  select(panels.has(saved) ? saved : tabs[0].dataset.tab, true);
}

async function cmd(...c) {
  await fetch("/api/command", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({command: c}),
  });
}

async function open_(target) {
  await fetch("/api/open", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({target}),
  });
}

function render() {
  const idle = !state["path"];
  const name = state["media-title"] || state["path"];
  titleMarquee.setText(idle ? "Nothing playing" : (name || "Loading…"));
  $("title").classList.toggle("idle", idle);

  const paused = !!state["pause"];
  set($("ppicon"), "icon", paused ? "#play" : "#pause");
  set($("playpause"), "ariaLabel", paused ? "Play" : "Pause");

  const dur = state["duration"] || 0, pos = state["time-pos"] || 0;
  set($("seek"), "max", dur || 100);
  set($("seek"), "disabled", !dur);
  if (!seeking) {
    set($("seek"), "value", pos);
    fill($("seek"), dur ? pos / dur * 100 : 0);
  }
  set($("pos"), "text", fmt(pos));
  set($("dur"), "text", fmt(dur));

  volSlider.setValue(state["volume"] ?? 100);
  speedSlider.setValue(state["speed"] ?? 1);

  const muted = !!state["mute"];
  set($("muteicon"), "icon", muted ? "#mute" : "#volume");
  set($("mute"), "ariaPressed", String(muted));
  $("mute").classList.toggle("muted", muted);

  markPlaying();
  syncSiblings();
  updateSkip();

  const fs = !!state["fullscreen"];
  set($("fsicon"), "icon", fs ? "#unfullscreen" : "#fullscreen");
  set($("fs"), "ariaPressed", String(fs));
  set($("fs"), "ariaLabel", fs ? "Exit fullscreen" : "Fullscreen");
  $("fs").classList.toggle("on", fs);

  renderTracks();
}

function renderTracks() {
  const tracks = state["track-list"] || [];
  for (const [kind, sel] of [["audio", $("atrack")], ["sub", $("strack")]]) {
    const items = tracks.filter(t => t.type === kind);
    const opts = (kind === "sub" ? [{id: "no", title: "Off", selected: !items.some(t => t.selected)}] : [])
      .concat(items.map(t => ({
        id: t.id,
        title: [t.lang, t.title].filter(Boolean).join(" — ") || "Track " + t.id,
        selected: t.selected,
      })));
    if (!opts.length) opts.push({id: "no", title: "None available", selected: true});
    const sig = JSON.stringify(opts);
    if (sel.dataset.sig === sig) continue;
    sel.dataset.sig = sig;
    sel.replaceChildren(...opts.map(o => {
      const el = document.createElement("option");
      el.value = o.id; el.textContent = o.title; el.selected = !!o.selected;
      return el;
    }));
    sel.disabled = items.length === 0;
  }
}

// ---------- WebSocket ----------
function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  const ws = new WebSocket(proto + location.host + "/ws");
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if ("status" in msg) Object.assign(state, msg.status);
    else if ("connected" in msg) {
      if (!msg.connected) for (const k in state) delete state[k];
    } else Object.assign(state, msg);
    document.body.classList.remove("disconnected");
    render();
  };
  ws.onclose = () => {
    document.body.classList.add("disconnected");
    setTimeout(connect, 2000);
  };
}

// ---------- controls ----------
$("playpause").onclick = () => cmd("cycle", "pause");
$("stop").onclick = () => cmd("stop");
$("fs").onclick = () => cmd("cycle", "fullscreen");

// ---------- next / previous file ----------
// Siblings come from the playing file's own folder, not from whatever the
// browser happens to be showing, so this still works after a page reload, when
// you have navigated elsewhere in the browser, or when playback was started
// from mpv itself.
let siblings = {folder: null, list: []};

function playingFolder() {
  const p = state["path"];
  if (!p || p.includes("://")) return null; // a URL has no siblings
  const i = p.lastIndexOf("/");
  return i > 0 ? p.slice(0, i) : null;
}

async function syncSiblings() {
  const folder = playingFolder();
  if (folder === siblings.folder) return;
  siblings = {folder, list: []};
  if (folder) {
    const r = await fetch("/api/browse?path=" + encodeURIComponent(folder));
    // a slower response for a folder we have since left must not overwrite
    if (r.ok && playingFolder() === folder) {
      siblings.list = (await r.json()).entries.filter(e => !e.is_dir).map(e => e.path);
    }
  }
  updateSkip();
}

function updateSkip() {
  const i = siblings.list.indexOf(state["path"] ?? "");
  const n = siblings.list.length;
  set($("prev"), "disabled", !(i > 0));
  set($("next"), "disabled", !(i >= 0 && i < n - 1));
  // A greyed button with no explanation reads as broken. Showing "1 / 1" makes
  // it obvious the folder simply has nothing to skip to.
  set($("fileidx"), "text", i >= 0 ? `${i + 1} / ${n}` : "");
  const why = n === 1 ? "Only file in this folder" : null;
  set($("prev"), "title", why ?? (i > 0 ? "Previous file" : "First file in folder"));
  set($("next"), "title", why ?? (i >= 0 && i < n - 1 ? "Next file" : "Last file in folder"));
}

function skip(step) {
  const i = siblings.list.indexOf(state["path"] ?? "");
  const target = i >= 0 ? siblings.list[i + step] : null;
  if (target) open_(target);
}
$("prev").onclick = () => skip(-1);
$("next").onclick = () => skip(1);
$("back").onclick = () => cmd("seek", -10);
$("fwd").onclick = () => cmd("seek", 10);

$("seek").oninput = () => {
  seeking = true;
  const v = +$("seek").value;
  set($("pos"), "text", fmt(v));
  fill($("seek"), v / (+$("seek").max || 100) * 100);
};
$("seek").onchange = () => { seeking = false; cmd("seek", +$("seek").value, "absolute"); };

$("mute").onclick = () => cmd("cycle", "mute");

const volSlider = detentSlider($("vol"), $("volout"), {
  min: 0, max: 130, step: 2, value: 100,
  detents: [{value: 100, label: "Full"}],
  format: v => Math.round(v) + "%",
  label: "Volume",
  onCommit: v => cmd("set_property", "volume", v),
});

const speedSlider = detentSlider($("speed"), $("speedout"), {
  min: 0.25, max: 3, step: 0.05, value: 1,
  // Only 1× gets a name; labelling the rest just repeats the number.
  detents: [0.5, 0.75, {value: 1, label: "Normal"}, 1.25, 1.5, 2],
  // Detents sit 0.25 apart; a narrow pull keeps in-between speeds draggable
  // on touch, where there is no arrow-key escape hatch.
  pull: 0.06,
  format: v => v.toFixed(2) + "×",
  label: "Playback speed",
  onCommit: v => cmd("set_property", "speed", v),
});

const trackVal = sel => isNaN(+sel.value) ? sel.value : +sel.value;
$("atrack").onchange = e => cmd("set_property", "aid", trackVal(e.target));
$("strack").onchange = e => cmd("set_property", "sid", trackVal(e.target));

// ---------- open url ----------
$("urlform").onsubmit = async e => {
  e.preventDefault();
  const target = $("urlinput").value.trim();
  if (!target) return;
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  await open_(target);
  btn.disabled = false;
  $("urlinput").value = "";
  $("urlinput").blur();
};

// ---------- file browser ----------
const AUDIO = /\.(mp3|flac|opus|m4a|ogg|wav|aac|wma)$/i;
// Captured once: these live inside tab panels that get unmounted.
const crumbEl = $("crumb"), filesEl = $("files"), themesEl = $("themes");

function row(icon, label, cls, onclick, i, path) {
  const li = document.createElement("li");
  if (cls) li.className = cls;
  li.style.setProperty("--i", Math.min(i, 12));
  if (path) { li.dataset.path = path; li.dataset.icon = icon; }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", "20"); svg.setAttribute("height", "20");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", icon);
  svg.appendChild(use);
  const span = document.createElement("span");
  span.textContent = label;
  li.append(svg, span);
  li.onclick = onclick;
  return li;
}

// mpv reports `path` as the exact string we sent from the row, so an equality
// match is enough. URLs simply match nothing.
let markedPath;
function markPlaying(force) {
  const playing = state["path"] ?? null;
  if (!force && playing === markedPath) return;
  markedPath = playing;
  for (const li of filesEl.children) {
    const on = !!li.dataset.path && li.dataset.path === playing;
    li.classList.toggle("playing", on);
    if (on) li.setAttribute("aria-current", "true");
    else li.removeAttribute("aria-current");
    const use = li.querySelector("use");
    if (use && li.dataset.icon) use.setAttribute("href", on ? "#audio" : li.dataset.icon);
  }
}

async function browse(path) {
  const r = await fetch("/api/browse" + (path ? "?path=" + encodeURIComponent(path) : ""));
  // A remembered folder may have been deleted or moved out of the root since
  // last time; fall back to the root rather than showing an empty browser.
  if (!r.ok) { if (path) browse(null); return; }
  const data = await r.json();
  crumbEl.textContent = data.path;
  try { localStorage.setItem("mpvremote-dir", data.path); } catch (e) {}

  const rows = [];
  if (data.parent) rows.push(row("#up", "Up a level", "dir", () => browse(data.parent), 0));
  data.entries.forEach((e, n) => {
    const icon = e.is_dir ? "#folder" : (AUDIO.test(e.name) ? "#music" : "#film");
    rows.push(row(icon, e.name, e.is_dir ? "dir" : "",
                  e.is_dir ? () => browse(e.path) : () => open_(e.path),
                  rows.length ? n + 1 : n,
                  e.is_dir ? null : e.path));
  });
  if (!data.entries.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "No media here";
    rows.push(li);
  }
  filesEl.replaceChildren(...rows);
  markPlaying(true); // fresh rows: re-apply regardless of the memo
}

// ---------- theme ----------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("mpvremote-theme", t); } catch (e) {}
  document.querySelector("meta[name=theme-color]").content =
    getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  for (const b of themesEl.children) {
    b.setAttribute("aria-pressed", String(b.dataset.t === t));
  }
  titleMarquee?.relayout();
}
themesEl.onclick = e => {
  const b = e.target.closest("button[data-t]");
  if (b) applyTheme(b.dataset.t);
};
// Created before the first applyTheme(), which re-measures it on font swap.
const titleMarquee = marquee($("title"), {speed: 40, gap: 56});

applyTheme(document.documentElement.dataset.theme || "cyberpunk");

initTabs($("tablist"), $("tabpanels"));

// ---------- server address ----------
// location.host is the address this device actually reached the server on, so
// it is right even behind a VPN or on a multi-homed box. Asking the server
// would just make it guess at something the browser already knows.
$("serveraddr").textContent = location.host;

let startDir = null;
try { startDir = localStorage.getItem("mpvremote-dir"); } catch (e) {}
browse(startDir);
connect(); // last: render() touches the sliders declared above
</script>
</body>
</html>
